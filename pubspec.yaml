name: daily_assistant
description: A free offline-first Arabic daily task management app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local database
  sqflite: ^2.4.2
  path: ^1.9.1

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Notifications and reminders
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

  # App settings
  shared_preferences: ^2.5.3

  # Date and time
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
